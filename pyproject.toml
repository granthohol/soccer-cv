[project]
name = "soccer-cv"
version = "0.1.0"
description = "base environment"
authors = [
    {name = "Grant Hohol",email = "ghohol@wisc.edu"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sports @ git+https://github.com/roboflow/sports@main",
    "roboflow (>=1.2.2,<2.0.0)",
    "ultralytics (>=8.3.170,<9.0.0)",
    "more-itertools (>=10.7.0,<11.0.0)",
    "plotly (>=6.2.0,<7.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
